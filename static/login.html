<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Đăng nhập hệ thống</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      color: #1e3a52;
    }

    /* ================= BACKGROUND ================= */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(180, 225, 235, 0.6),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 80%,
          rgba(249, 232, 162, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #78A4CB,
          #95BDD7,
          #B4E1EB
        );
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      animation: float 8s infinite ease-in-out;
    }

    .circle-1 {
      width: 300px;
      height: 300px;
      background: rgba(149, 189, 215, 0.4);

      top: 10%;
      left: 10%;
    }

    .circle-2 {
      width: 400px;
      height: 400px;
      background: rgba(249, 232, 162, 0.35);

      right: 5%;
      bottom: 5%;

      animation-delay: 2s;
    }

    .circle-3 {
      width: 180px;
      height: 180px;

      background: rgba(180, 225, 235, 0.5);

      right: 25%;
      top: 10%;

      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(30px, -30px);
      }
    }

    /* ================= LOGIN ================= */

    .login-wrapper {
      position: relative;
      z-index: 10;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .login-card {
      width: 420px;

      padding: 40px;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.55);

      border: 1px solid rgba(255, 255, 255, 0.6);

      backdrop-filter: blur(25px);

      box-shadow:
        0 25px 80px rgba(120, 164, 203, 0.35);

      animation: cardAppear 0.8s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      text-align: center;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;

      color: #5b7a94;

      font-size: 14px;

      margin-bottom: 30px;
    }

    /* ================= ERROR ================= */

    .form-error {
      display: none;
      margin-bottom: 18px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #b3261e;
      font-size: 13px;
      line-height: 1.5;
    }

    .form-error.show {
      display: block;
    }

    /* ================= INPUT ================= */

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;

      margin-bottom: 8px;

      color: #3d5d78;

      font-size: 14px;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;

      padding: 15px 16px;

      border-radius: 12px;

      border:
        1px solid rgba(120, 164, 203, 0.35);

      background:
        rgba(255, 255, 255, 0.5);

      color: #1e3a52;

      outline: none;

      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #7a97ac;
    }

    .input-wrapper.has-toggle input {
      padding-right: 46px;
    }

    .toggle-password {
      position: absolute;

      right: 6px;
      top: 50%;
      transform: translateY(-50%);

      width: 34px;
      height: 34px;

      border: none;
      background: transparent;
      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      color: #5b7a94;
      transition: background .2s, color .2s;
    }

    .toggle-password:hover {
      background: rgba(120, 164, 203, 0.15);
      color: #1e3a52;
    }

    .toggle-password svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toggle-password .icon-eye-off {
      display: none;
    }

    .toggle-password.is-visible .icon-eye {
      display: none;
    }

    .toggle-password.is-visible .icon-eye-off {
      display: block;
    }

    input:focus {
      border-color: #78A4CB;

      box-shadow:
        0 0 0 4px rgba(120, 164, 203, 0.2);

      transform: translateY(-2px);
    }

    /* ================= OPTIONS ================= */

    .login-options {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #5b7a94;
    }

    .remember input {
      width: auto;
      padding: 0;
    }

    a {
      color: #4c7ca5;

      text-decoration: none;

      transition: 0.3s;
    }

    a:hover {
      color: #78A4CB;
    }

    /* ================= LOGIN BUTTON ================= */

    .login-btn {
      width: 100%;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #78A4CB,
          #95BDD7
        );

      color: white;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-4px);

      box-shadow:
        0 15px 35px rgba(120, 164, 203, 0.5);
    }

    .login-btn:active {
      transform: scale(0.97);
    }

    .login-btn:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* ================= LOADING ================= */

    .loader {
      display: none;

      width: 20px;
      height: 20px;

      margin: auto;

      border:
        3px solid rgba(255, 255, 255, 0.5);

      border-top-color: white;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= SUCCESS SCREEN ================= */

    .success-screen {
      display: none;

      width: 420px;

      padding: 50px 40px;

      text-align: center;

      border-radius: 24px;

      background:
        rgba(255, 255, 255, 0.55);

      border:
        1px solid rgba(255, 255, 255, 0.6);

      backdrop-filter: blur(25px);

      box-shadow:
        0 25px 80px rgba(120, 164, 203, 0.35);

      animation: successAppear 0.6s ease;
    }

    .success-screen h2 {
      margin-bottom: 10px;
      color: #1e3a52;
    }

    .success-screen p {
      color: #5b7a94;
      font-size: 14px;
    }

    .success-progress {
      height: 5px;

      margin-top: 30px;

      border-radius: 20px;

      overflow: hidden;

      background:
        rgba(255, 255, 255, 0.1);
    }

    .success-progress div {
      height: 100%;
      width: 0%;

      background:
        linear-gradient(
          90deg,
          #78A4CB,
          #F9E8A2
        );

      animation: progress 0.6s linear forwards;
    }

    @keyframes successAppear {
      from {
        opacity: 0;
        transform: scale(0.85) translateY(30px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes progress {
      to {
        width: 100%;
      }
    }

    /* ================= EXIT LOGIN ================= */

    .hide-login {
      animation: hideLogin 0.5s ease forwards;
    }

    @keyframes hideLogin {
      from {
        opacity: 1;
        transform: scale(1);
      }

      to {
        opacity: 0;
        transform: scale(0.9) translateY(-30px);
      }
    }

    /* ================= MOBILE ================= */

    @media (max-width: 500px) {

      .login-card,
      .success-screen {
        width: 100%;
        padding: 30px 25px;
      }

    }

  </style>
</head>

<body>

  <div class="background">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
    <div class="circle circle-3"></div>
  </div>


  <div class="login-wrapper">

    <!-- LOGIN CARD -->

    <div class="login-card" id="loginCard">

      <h1>Chào mừng trở lại!</h1>

      <p class="subtitle">
        Đăng nhập để tiếp tục sử dụng hệ thống
      </p>

      <div class="form-error" id="formError"></div>

      <form id="loginForm" autocomplete="off">

        <div class="input-group">

          <label for="username">Tên đăng nhập</label>

          <div class="input-wrapper">

            <input
              type="text"
              id="username"
              name="username"
              placeholder="Nhập tên đăng nhập"
              autocomplete="username"
              required
            />

          </div>

        </div>


        <div class="input-group">

          <label for="password">Mật khẩu</label>

          <div class="input-wrapper has-toggle">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Nhập mật khẩu"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Hiện mật khẩu"
              aria-pressed="false"
            >
              <svg class="icon-eye" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M9.4 5.3A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a13.2 13.2 0 0 1-3.17 3.88M6.6 6.6C3.9 8.3 2 12 2 12s4 7 11 7a10.6 10.6 0 0 0 4.06-.8"/></svg>
            </button>

          </div>

        </div>


        <div class="login-options">

          <label class="remember">

            <input type="checkbox" id="remember" />

            Ghi nhớ đăng nhập

          </label>

        </div>


        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >

          <span id="btnText">
            Đăng nhập
          </span>

          <span
            class="loader"
            id="loader"
          ></span>

        </button>

      </form>

    </div>


    <!-- SUCCESS SCREEN -->

    <div
      class="success-screen"
      id="successScreen"
    >

      <h2>
        Đăng nhập thành công!
      </h2>

      <p>
        Đang chuyển đến hệ thống...
      </p>


      <div class="success-progress">

        <div></div>

      </div>

    </div>

  </div>


  <script>

    const loginForm = document.getElementById("loginForm");
    const loginCard = document.getElementById("loginCard");
    const successScreen = document.getElementById("successScreen");
    const loginBtn = document.getElementById("loginBtn");
    const btnText = document.getElementById("btnText");
    const loader = document.getElementById("loader");
    const formError = document.getElementById("formError");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {
      const isVisible = passwordInput.type === "text";
      passwordInput.type = isVisible ? "password" : "text";
      togglePassword.classList.toggle("is-visible", !isVisible);
      togglePassword.setAttribute("aria-pressed", String(!isVisible));
      togglePassword.setAttribute("aria-label", isVisible ? "Hiện mật khẩu" : "Ẩn mật khẩu");
      passwordInput.focus({ preventScroll: true });
    });

    function showError(message) {
      formError.textContent = message;
      formError.classList.add("show");
    }

    function hideError() {
      formError.classList.remove("show");
    }

    function setLoading(isLoading) {
      loginBtn.disabled = isLoading;
      btnText.style.display = isLoading ? "none" : "inline";
      loader.style.display = isLoading ? "block" : "none";
    }

    loginForm.addEventListener("submit", async function (e) {
      e.preventDefault();
      hideError();
      setLoading(true);

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const remember = document.getElementById("remember").checked;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password, remember }),
        });

        if (res.ok) {
          loginCard.classList.add("hide-login");
          setTimeout(() => {
            loginCard.style.display = "none";
            successScreen.style.display = "block";
          }, 500);

          setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            window.location.href = params.get("next") || "/";
          }, 900);
        } else {
          let message = "Sai tên đăng nhập hoặc mật khẩu.";
          try {
            const data = await res.json();
            if (data && data.error) message = data.error;
          } catch (err) {}
          showError(message);
          setLoading(false);
        }
      } catch (err) {
        showError("Không thể kết nối tới máy chủ. Vui lòng thử lại.");
        setLoading(false);
      }
    });

  </script>

</body>
</html>
